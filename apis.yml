name: Lumosity
description: 'Lumosity is a consumer brain-training platform built by Lumos Labs that offers cognitive
  games and personalized daily workouts targeting memory, attention, problem solving, flexibility, and
  processing speed. The service adapts difficulty to individual performance, tracks progress over time,
  and is delivered through the web and iOS/Android mobile apps. Backed by Norwest Venture Partners, the
  company was surfaced through VC-portfolio discovery; probing its public surface found no developer
  portal, public API, or documented programmatic integration — it is a direct-to-consumer product with
  no API surface at this time.'
